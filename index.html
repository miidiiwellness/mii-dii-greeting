<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17251f">
<title>Mii Dii Wellness | A Little Wish for You</title>
<style>
:root{--forest:#17251f;--deep:#24372d;--gold:#c6a66a;--ivory:#f4efe5;--muted:#c9c1b1;--line:rgba(198,166,106,.55)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#34483a,var(--forest) 65%);color:var(--ivory);font-family:Georgia,'Times New Roman',serif;display:grid;place-items:center;padding:20px}
.frame{width:min(100%,560px);padding:10px;border:1px solid var(--line);background:#ffffff05;box-shadow:0 30px 90px #0006}
.panel{position:relative;text-align:center;padding:clamp(28px,7vw,54px) clamp(20px,6vw,48px) 36px;border:1px solid #c6a66a47;background:linear-gradient(155deg,#ffffff0e,#ffffff03 55%),var(--deep)}
.panel:before,.panel:after{content:"✧";position:absolute;top:17px;color:var(--gold);font-size:16px}.panel:before{left:19px}.panel:after{right:19px}
.logo{display:block;width:min(100%,260px);height:auto;margin:0 auto 19px}
.eyebrow{font:10px/1.7 Arial,sans-serif;letter-spacing:.29em;text-transform:uppercase;color:var(--gold);margin:0 0 13px}
h1{font-weight:400;font-size:clamp(29px,7vw,43px);line-height:1.12;margin:0;color:var(--ivory)}
.sub{font:11px/1.8 Arial,sans-serif;letter-spacing:.19em;text-transform:uppercase;color:var(--muted);margin:15px 0 26px}
.ornament{display:flex;align-items:center;gap:13px;width:120px;margin:0 auto 22px;color:var(--gold);font-size:12px}.ornament:before,.ornament:after{content:"";height:1px;flex:1;background:var(--line)}
.message{min-height:156px;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:12px 0 20px}
.en{font-size:clamp(21px,5vw,27px);line-height:1.48;color:var(--ivory)}.fi{font:italic 15px/1.75 Arial,sans-serif;color:#d3c7ae}
button{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:14px 25px;min-width:210px;font:10px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:.2s}
button:hover,button:focus-visible{background:var(--gold);color:var(--forest);outline:none}
.footer{margin:30px 0 0;color:var(--gold);font:10px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase}.signature{margin-top:10px;color:var(--muted);font:italic 12px Arial,sans-serif}
@media(max-width:380px){body{padding:12px}.frame{padding:7px}.panel{padding-left:17px;padding-right:17px}}

<h1>A Little Wish<br>for You</h1>
<div class="sub">A moment to pause · A moment for you</div><div class="ornament">✧</div>
<div class="message" aria-live="polite"><div class="en" id="english">May today bring you a quiet kind of happiness.</div><div class="fi" id="finnish">Tuokoon tämä päivä sinulle hiljaista onnea.</div></div>
<button id="newWish" type="button">Discover another wish</button>
<div class="footer">Feel Good · Feel Beautiful · Be You</div><div class="signature">With compliments, Mii Dii Wellness</div>
</section></main>
<script>
const wishes=[
["May today bring you a quiet kind of happiness.","Tuokoon tämä päivä sinulle hiljaista onnea."],
["You deserve moments that feel as beautiful as you are.","Ansaitset hetkiä, jotka ovat yhtä kauniita kuin sinä."],
["May peace find you, and may joy stay a little longer.","Löytäköön rauha sinut ja viipyköön ilo luonasi."],
["Take this moment for yourself. You are worth it.","Ota tämä hetki itsellesi. Olet sen arvoinen."],
["Wishing you a day touched by grace and gentle moments.","Toivotamme sinulle päivää, jota kaunistavat lempeys ja ihanat hetket."],
["May you leave today feeling lighter, calmer and renewed.","Lähde tästä päivästä kevyemmin, rauhallisemmin ja virkistyneenä."],
["A little kindness to yourself can change the whole day.","Pieni lempeys itseäsi kohtaan voi muuttaa koko päivän."],
["May beautiful things find their way to you.","Löytäkööt kauniit asiat tiensä luoksesi."],
["You are deserving of rest, care and every good thing.","Ansaitset lepoa, huolenpitoa ja kaikkea hyvää."],
["Let this be your reminder to slow down and simply be.","Olkoon tämä muistutus pysähtyä ja antaa itsesi vain olla."]
];
let last=-1;function showWish(){let n;do{n=Math.floor(Math.random()*wishes.length)}while(n===last);last=n;document.getElementById("english").textContent=wishes[n][0];document.getElementById("finnish").textContent=wishes[n][1]}
document.getElementById("newWish").addEventListener("click",showWish);showWish();
</script></body></html>
